name: Integration

# Exercises the package as PUBLISHED on npm, against staging. CI covers this
# working tree; nothing there would notice a `files` list that ships no `dist`,
# a `bin` a client cannot spawn, or a release that never landed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '43 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # npm, not pnpm, and no cache: the point is the install a stranger gets.
      # The script skips with a reason when nothing is published yet. The two
      # keyless tests run either way, because a server that fails to start is
      # worth catching without a credential.
      - run: node scripts/run.mjs
        working-directory: integration
        env:
          INTERNETDATA_STAGING_KEY: ${{ secrets.INTERNETDATA_STAGING_KEY }}
